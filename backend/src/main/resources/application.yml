server:
  port: 8080

spring:
  application:
    name: san-api

  datasource:
    url: jdbc:postgresql://localhost:5432/san
    username: san
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 7200000    # 2시간
  refresh-expiration: 604800000 # 7일

auth:
  login:
    max-fail-count: ${AUTH_LOGIN_MAX_FAIL_COUNT:5}
    fail-window-seconds: ${AUTH_LOGIN_FAIL_WINDOW_SECONDS:300}
    lock-duration-seconds: ${AUTH_LOGIN_LOCK_DURATION_SECONDS:900}

oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: ${GITHUB_REDIRECT_URI}
    scope: ${GITHUB_SCOPE:read:user,repo}
    success-redirect-uri: ${GITHUB_SUCCESS_REDIRECT_URI}
    failure-redirect-uri: ${GITHUB_FAILURE_REDIRECT_URI}
    token-encryption-secret: ${GITHUB_TOKEN_ENCRYPTION_SECRET}

ai:
  server:
    base-url: ${AI_SERVER_URL:http://localhost:8001}
    connect-timeout-millis: ${AI_SERVER_CONNECT_TIMEOUT_MILLIS:5000}
    read-timeout-millis: ${AI_SERVER_READ_TIMEOUT_MILLIS:300000}
  recommendation:
    github-stars:
      limit: ${AI_GITHUB_STARS_RECOMMENDATION_LIMIT:5}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:us-east-1}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:5}
    max-file-size-bytes: ${AWS_S3_MAX_FILE_SIZE_BYTES:10485760}
    allowed-extensions: ${AWS_S3_ALLOWED_EXTENSIONS:jpg,jpeg,png,webp}
    allowed-content-types: ${AWS_S3_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}

feedback:
  mattermost:
    webhook-url: ${FEEDBACK_MM_WEBHOOK_URL:}
    max-attempts: ${FEEDBACK_MM_MAX_ATTEMPTS:3}
