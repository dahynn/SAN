name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            REPO_URL="https://github.com/${{ github.repository }}.git"
            DEPLOY_DIR="$HOME/san-backend"

            # 최초 실행 시 clone, 이후엔 pull
            if [ ! -d "$DEPLOY_DIR" ]; then
              git clone "$REPO_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            # .env 복사
            cp /var/www/san/.env.be .env
            if ! grep -q '^GRAFANA_PORT=' .env; then
              printf '\nGRAFANA_PORT=3001\n' >> .env
            fi

            # Docker 배포 (DB/Redis, backend, Grafana)
            docker compose up -d db redis

            echo "Waiting for database to start..."
            DB_READY=0
            for i in {1..12}; do
              if docker compose exec -T db pg_isready -U san -d san; then
                docker compose exec -T db bash /docker-entrypoint-initdb.d/02-grafana-reader.sh
                DB_READY=1
                break
              fi
              echo "Waiting for database... ($i/12)"
              sleep 5
            done
            if [ "$DB_READY" != "1" ]; then
              echo "Database health check failed:"
              docker compose logs db
              exit 1
            fi

            docker compose up -d --build backend grafana

            # 헬스체크 (최대 60초 대기)
            echo "Waiting for backend to start..."
            for i in {1..12}; do
              if docker compose exec -T backend curl -f http://localhost:8080/actuator/health; then
                echo "Backend is UP!"
                exit 0
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done
            
            echo "Health check failed:"
            docker compose logs backend
            exit 1
